name: backend-diagnostics

on:
  pull_request:

permissions:
  contents: read

jobs:
  ruff-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend
        run: pip install -e ".[dev]"
      - name: Capture Ruff report
        id: ruff
        continue-on-error: true
        run: python -m ruff check backend scripts --output-format=concise > ruff-report.txt 2>&1
      - name: Upload Ruff report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ruff-report-${{ github.run_id }}
          path: ruff-report.txt
          retention-days: 1
      - name: Fail when Ruff failed
        if: steps.ruff.outcome == 'failure'
        run: exit 1
