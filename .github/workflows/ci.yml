name: quality-gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend
        run: pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check backend scripts
      - name: Pytest
        run: python -m pytest backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install
        run: npm --prefix frontend install
      - name: Build
        run: npm --prefix frontend run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build and start stack
        run: docker compose up -d --build
      - name: Wait for frontend
        run: |
          for i in {1..45}; do
            if curl --fail --silent http://localhost:3000 >/dev/null; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Install E2E dependencies
        run: npm --prefix e2e install
      - name: Install Chromium
        run: npm --prefix e2e exec playwright install --with-deps chromium
      - name: Playwright
        run: npm --prefix e2e test
      - name: Docker logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop stack
        if: always()
        run: docker compose down --remove-orphans
