services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      VERITYGRAPH_ENV: docker
      VERITYGRAPH_FRONTEND_ORIGIN: http://localhost:3000
      VERITYGRAPH_DATABASE_PATH: /data/veritygraph.db
      VERITYGRAPH_WIKIPEDIA_PROVIDER: ${VERITYGRAPH_WIKIPEDIA_PROVIDER:-live}
      VERITYGRAPH_WEB_PROVIDER: ${VERITYGRAPH_WEB_PROVIDER:-live}
    volumes:
      - veritygraph_data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  veritygraph_data:
